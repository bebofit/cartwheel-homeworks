<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartwheel review</title>
<style>
  :root {
    --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --bg: #f8fafc;
    --user: #2563eb; --agent: #059669; --tool: #d97706; --retrieval: #0d9488;
    --note: #f59e0b; --note-bg: #fef3c7; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; }
  header .src { font-size: 12px; color: var(--muted); }
  header .src.fallback { color: var(--err); }
  header .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  #layout { display: flex; height: calc(100vh - 45px); }
  aside { width: 260px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: #fff; }
  aside input { width: calc(100% - 16px); margin: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .conv-row { padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent; font-size: 13px; }
  .conv-row:hover { background: var(--bg); }
  .conv-row.active { background: #eef2ff; border-left-color: var(--user); }
  .conv-row .sub { font-size: 11px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #d1d5db; }
  .dot.partial { background: var(--note); } .dot.done { background: var(--ok); }
  main { flex: 1; overflow-y: auto; padding: 16px 24px 120px; }
  #conv-header { max-width: 980px; margin-bottom: 16px; }
  #conv-header .title { font-size: 16px; font-weight: 600; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 8px; margin: 2px 4px 2px 0; border-radius: 10px; background: #f1f5f9; color: var(--muted); }
  .chip.role { background: #eef2ff; color: var(--user); }
  button { font: inherit; font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { border-color: #9ca3af; }
  button:disabled { opacity: 0.4; cursor: default; }
  .nav-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .keys { font-size: 11px; color: var(--muted); margin-left: 8px; }
  #intent { margin-top: 8px; padding: 8px 12px; border: 1px dashed #9ca3af; border-radius: 6px; font-size: 12px; background: #fff; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; }
  details.sys { max-width: 720px; margin-bottom: 24px; font-size: 12px; color: var(--muted); }
  details.sys pre { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); padding: 8px; border-radius: 6px; }
  #content { display: flex; gap: 16px; max-width: 980px; }
  #body { flex: 1; max-width: 720px; min-width: 0; }
  #margin { position: relative; width: 240px; flex: none; }
  .turn { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 40px; }
  .turn-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
  .turn-head .num { font-weight: 600; color: var(--ink); font-size: 13px; }
  .turn-head code { font-size: 11px; }
  .turn-head .spacer { flex: 1; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #f1f5f9; }
  .pill.notes { background: var(--note-bg); color: var(--warn); }
  .pill.clean { background: #dcfce7; color: var(--ok); }
  .msg { border-left: 4px solid var(--line); padding: 4px 10px; margin: 6px 0; }
  .msg .role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .msg[data-role=user] { border-color: var(--user); } .msg[data-role=user] .role { color: var(--user); }
  .msg[data-role=agent], .msg[data-role=narration] { border-color: var(--agent); }
  .msg[data-role=agent] .role, .msg[data-role=narration] .role { color: var(--agent); }
  .msg[data-role=narration] { background: #f0fdf4; }
  .msg[data-role=narration] .text { font-style: italic; }
  .msg[data-role=agent] { background: #f0fdf4; border-left-width: 6px; }
  .text { white-space: pre-wrap; }
  .toolbox { border: 1px solid #fde68a; border-left: 4px solid var(--tool); border-radius: 6px; padding: 6px 10px; margin: 6px 0; background: #fffbeb; }
  .toolbox.retrieval { border-color: #99f6e4; border-left-color: var(--retrieval); background: #f0fdfa; }
  .toolbox .fn { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: 8px; font-family: ui-monospace, Menlo, monospace; }
  .badge.ok { background: #dcfce7; color: var(--ok); } .badge.warn { background: #ffedd5; color: var(--warn); }
  .badge.error { background: #fee2e2; color: var(--err); } .badge.neutral { background: #f1f5f9; color: var(--muted); }
  .args-inline { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  details.result summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  pre.json { white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 4px 0; padding: 6px 8px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .hits { font-size: 12px; margin: 4px 0; padding-left: 18px; }
  .hits code { font-size: 11px; }
  mark.hl { background: var(--note-bg); border-bottom: 2px solid var(--note); padding: 0; }
  mark.hl.hover, .mnote.hover { outline: 2px solid var(--note); }
  mark.pending { background: #c7d2fe; }
  .mnote { position: absolute; left: 0; width: 240px; font-size: 12px; background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--note); border-radius: 6px; padding: 6px 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .mnote .q { color: var(--muted); font-style: italic; margin-bottom: 4px; }
  .mnote .acts { display: none; gap: 4px; margin-top: 4px; }
  .mnote:hover .acts { display: flex; }
  .mnote .edited { font-size: 10px; color: var(--muted); }
  #popover { position: fixed; z-index: 10; width: 320px; background: #fff; border: 1px solid #9ca3af; border-radius: 8px; padding: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  #popover .q { font-size: 12px; color: var(--muted); font-style: italic; max-height: 60px; overflow: hidden; margin-bottom: 6px; }
  #popover textarea { width: 100%; height: 70px; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; }
  #popover small { color: var(--muted); }
  nav { display: flex; gap: 4px; }
  .tab.active { background: #eef2ff; border-color: var(--user); color: var(--user); }
  .toggle { display: block; font-size: 11px; color: var(--muted); padding: 0 12px 6px; }
  .batch-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); padding: 10px 12px 4px; border-top: 1px solid var(--line); }
  .chip.batch { background: #ede9fe; color: #6d28d9; }
  .chip.context { background: #f1f5f9; color: var(--muted); font-style: italic; }
  .turn.context { opacity: .75; }
  #progress, #taxonomy, #labels { height: calc(100vh - 45px); overflow-y: auto; padding: 16px 24px; }
  #labels { max-width: 1100px; font-size: 13px; }
  #labels h2 { font-size: 15px; margin: 18px 0 6px; }
  #labels table { border-collapse: collapse; background: #fff; margin: 6px 0 14px; }
  #labels th, #labels td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  #labels a[data-sid] { cursor: pointer; color: var(--user); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #labels .flag { color: var(--muted); font-size: 12px; }
  #labels .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #labels .on { font-weight: 700; outline: 2px solid var(--user); }
  #taxonomy { max-width: 980px; }
  #taxonomy h2 { font-size: 15px; margin: 20px 0 6px; }
  .mode { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--user); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .mode.gap { border-left-color: var(--warn); } .mode.single { border-left-color: var(--muted); }
  .mode h3 { margin: 0 0 4px; font-size: 14px; font-family: ui-monospace, Menlo, monospace; }
  .mode .def { margin: 4px 0 8px; }
  .mode dl { display: grid; grid-template-columns: 130px 1fr; gap: 2px 10px; margin: 0 0 8px; font-size: 12px; }
  .mode dt { color: var(--muted); }
  .mode ul { margin: 2px 0 6px; padding-left: 18px; }
  .mode li { margin: 2px 0; }
  .mode a[data-sid] { cursor: pointer; color: var(--user); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .mode .tag { font-size: 10px; padding: 0 6px; border-radius: 8px; background: #f1f5f9; color: var(--muted); margin-left: 4px; }
  .mode .tag.agent { background: #ede9fe; color: #6d28d9; }
  .mode details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  #progress table { border-collapse: collapse; margin: 8px 0 24px; font-size: 13px; background: #fff; }
  #progress th, #progress td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  #progress h2 { font-size: 15px; margin: 16px 0 4px; }
  #progress .todo a { cursor: pointer; color: var(--user); margin-right: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #tip { position: fixed; z-index: 20; max-width: 320px; font-size: 12px; background: #111827; color: #fff; padding: 6px 10px; border-radius: 6px; pointer-events: none; white-space: pre-wrap; }
  .sugg { border: 1px dashed #a78bfa; background: #faf5ff; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; }
  .sugg .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #6d28d9; }
  .sugg .q { color: var(--muted); font-style: italic; margin: 4px 0; }
  .sugg .why { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .sugg .acts { display: flex; gap: 6px; margin-top: 6px; }
  .sugg.decided { border-style: solid; border-color: var(--line); background: #fff; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .mnote .origin, .pill.draft { font-size: 10px; color: #6d28d9; }
  .pill.draft { background: #ede9fe; font-size: 11px; }
  .turn-notes:empty { display: none; }
  .turn-notes { margin-bottom: 8px; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: #111827; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; display: none; }
  .empty { color: var(--muted); padding: 40px; }
  @media (max-width: 1200px) {
    aside { width: 200px; }
    #margin, .mnote { width: 190px; }
    main { padding: 12px 12px 120px; }
  }
  @media (max-width: 900px) {
    aside { width: 160px; }
    #content { flex-direction: column; }
    #margin { width: 100%; }
    .mnote { position: static; width: auto; margin-bottom: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>Cartwheel review</h1>
  <nav><button class="tab active" data-view="review">Review</button><button class="tab" data-view="progress">Progress</button><button class="tab" data-view="taxonomy">Taxonomy</button><button class="tab" data-view="labels">Labels</button></nav>
  <span id="src" class="src"></span>
  <span id="count" class="count"></span>
</header>
<div id="layout">
  <aside>
    <input id="filter" placeholder="Filter by scenario, role, or tool">
    <label id="all-toggle" class="toggle" hidden><input type="checkbox" id="show-all"> show conversations outside the sample</label>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="conv-header"></div>
    <details class="sys" id="sys" hidden><summary>System prompt for this conversation (collapsed)</summary><pre id="sys-text"></pre></details>
    <div id="content"><div id="body"><div class="empty">Choose a conversation.</div></div><div id="margin"></div></div>
  </main>
</div>
<div id="progress" hidden></div>
<div id="taxonomy" hidden></div>
<div id="labels" hidden></div>
<div id="popover" hidden>
  <div class="q"></div>
  <textarea placeholder="Describe what went wrong, in your own words"></textarea>
  <small>Enter saves · Shift+Enter new line · Esc cancels</small>
</div>
<div id="tip" hidden></div>
<div id="toast"></div>

<script>
const state = { meta: {}, list: [], conv: null, annotations: [], suggestions: [], pending: null, showIntent: false, manifest: { items: [], excluded: [], batches: {} } };
const $ = id => document.getElementById(id);

const api = {
  async get(path) { const r = await fetch(path); return r.json(); },
  async post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    return r.json();
  },
};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function pretty(v) { return typeof v === 'string' ? v : JSON.stringify(v, null, 2); }
function uid() { return 'ann-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2500); }

/* ---------- annotations ---------- */
const active = a => (a.status || 'active') === 'active';
function annsFor(traceId) { return state.annotations.filter(a => a.trace_id === traceId && active(a)); }
function traceStatus(traceId) {
  const anns = annsFor(traceId);
  if (anns.some(a => a.kind === 'note')) return 'notes';
  if (anns.some(a => a.kind === 'no_failure')) return 'clean';
  return 'unreviewed';
}
async function save() {
  localStorage.setItem('review_app_backup', JSON.stringify(state.annotations));
  try { state.annotations = await api.post('/api/annotations', state.annotations); }
  catch (e) { toast('Save failed: ' + e.message + ' (backup kept in this browser)'); }
  renderList(); renderCount();
}
async function addNote(fields) {
  const conv = state.conv;
  for (const a of annsFor(fields.trace_id)) if (a.kind === 'no_failure') a.status = 'deleted';
  state.annotations.push({ id: uid(), kind: 'note', session_id: conv.session_id, scenario_id: conv.scenario_id, status: 'active', ...fields });
  await save(); renderConv();
}
async function toggleNoFailure(traceId) {
  const existing = annsFor(traceId).find(a => a.kind === 'no_failure');
  if (existing) existing.status = 'deleted';
  else state.annotations.push({ id: uid(), kind: 'no_failure', session_id: state.conv.session_id, scenario_id: state.conv.scenario_id, trace_id: traceId, note: 'no failure observed', status: 'active' });
  await save(); renderConv();
}
async function editNote(id) {
  const a = state.annotations.find(x => x.id === id);
  const next = prompt('Edit note (the original text is kept in history):', a.note);
  if (next === null || next.trim() === a.note) return;
  a.note = next.trim(); await save(); renderConv();
}
async function deleteNote(id) {
  if (!confirm('Delete this note? It stays in the saved history as deleted.')) return;
  state.annotations.find(x => x.id === id).status = 'deleted';
  await save(); renderConv();
}

/* ---------- agent suggestions (kept apart from human annotations) ---------- */
function suggsFor(traceId) { return state.suggestions.filter(s => s.trace_id === traceId); }
const pendingSugg = traceId => suggsFor(traceId).find(s => (s.status || 'pending') === 'pending');
async function decide(id, status, extra = {}) {
  try { state.suggestions = await api.post('/api/suggestions/decide', { id, status, ...extra }); }
  catch (e) { toast('Decision not saved: ' + e.message); }
}
async function acceptSuggestion(id, edit) {
  const s = state.suggestions.find(x => x.id === id);
  if (s.kind === 'no_failure') {
    if (traceStatus(s.trace_id) === 'notes') { toast('This trace already has your notes; reject the draft or delete your notes first'); return false; }
    if (traceStatus(s.trace_id) !== 'clean') {
      state.annotations.push({ id: uid(), kind: 'no_failure', session_id: s.session_id, scenario_id: s.scenario_id, trace_id: s.trace_id, note: 'no failure observed', status: 'active', origin: 'agent_suggestion', suggestion_id: s.id });
    }
    await save(); await decide(id, 'accepted');
  } else {
    const note = edit ? prompt('Edit the draft before accepting it (the draft text is kept on the suggestion):', s.note) : s.note;
    if (note === null || !note.trim()) return false;
    let start = 0, end = 0;
    if (s.field !== 'turn') {
      const el = fieldEl(s.trace_id, s.field);
      start = el ? el.textContent.indexOf(s.quote) : -1;
      if (start < 0) { toast('Quoted text not found in this turn; use Edit or Reject'); return false; }
      end = start + s.quote.length;
    }
    for (const a of annsFor(s.trace_id)) if (a.kind === 'no_failure') a.status = 'deleted';
    state.annotations.push({ id: uid(), kind: 'note', session_id: s.session_id, scenario_id: s.scenario_id, trace_id: s.trace_id, field: s.field, start, end, quote: s.quote || '', note: note.trim(), status: 'active', origin: 'agent_suggestion', suggestion_id: s.id });
    await save();
    await decide(id, note.trim() === s.note ? 'accepted' : 'edited', { final_note: note.trim() });
  }
  renderConv(); renderCount();
  return true;
}
async function rejectSuggestion(id) {
  const reason = prompt('Reject this draft. Why? (optional, saved with the suggestion)', '');
  if (reason === null) return false;
  await decide(id, 'rejected', { reason: reason.trim() || null });
  renderConv();
  return true;
}
function renderSuggestions(t) {
  return suggsFor(t.trace_id).map(s => {
    const st = s.status || 'pending';
    if (st !== 'pending') {
      return `<div class="sugg decided">Agent draft ${esc(st)}${s.reason ? ': ' + esc(s.reason) : ''} · “${esc(clip(s.kind === 'no_failure' ? 'No failure observed' : s.note, 90))}”</div>`;
    }
    const what = s.kind === 'no_failure' ? '<div><b>No failure observed</b></div>'
      : `${s.field === 'turn' ? '<div class="q">(whole turn)</div>' : `<div class="q">on ${esc(s.field)}: “${esc(clip(s.quote, 140))}”</div>`}<div>${esc(s.note)}</div>`;
    const lbl = s.source === 'search'
      ? `Search ${esc(s.search_run)} suggestion for ${esc(s.mode)}: a retrieval signal, not a label. Accept only if the mode applies.`
      : 'Agent draft, not your annotation until you accept it';
    return `<div class="sugg"><div class="lbl">${lbl}</div>${what}
      ${s.evidence ? `<div class="why">Evidence: ${esc(s.evidence)}</div>` : ''}
      <div class="acts"><button data-act="sugg-accept" data-sugg="${esc(s.id)}">Accept (a)</button>
      ${s.kind === 'no_failure' ? '' : `<button data-act="sugg-edit" data-sugg="${esc(s.id)}">Edit, then accept</button>`}
      <button data-act="sugg-reject" data-sugg="${esc(s.id)}">Reject (r)</button></div></div>`;
  }).join('');
}

/* ---------- list ---------- */
/* ---------- sample manifest ---------- */
const hasSample = () => state.manifest.items.length > 0;
function sampleItem(traceId) { return state.manifest.items.find(i => i.trace_id === traceId); }
function convBatch(c) { const i = state.manifest.items.find(i => i.session_id === c.session_id); return i ? i.batch : null; }
function sampleTraces() { return hasSample() ? state.manifest.items.map(i => i.trace_id) : state.list.flatMap(c => c.trace_ids); }
function batchLabel(key) { return (state.manifest.batches[key] || {}).label || key; }

function renderList() {
  const q = $('filter').value.trim().toLowerCase();
  const showAll = !hasSample() || $('show-all').checked;
  $('all-toggle').hidden = !hasSample();
  const rows = state.list.filter(c => (showAll || convBatch(c)) && (!q || [c.scenario_id, c.role, ...c.tools].join(' ').toLowerCase().includes(q)));
  const row = c => {
    const ids = hasSample() && convBatch(c) ? c.trace_ids.filter(sampleItem) : c.trace_ids;
    const done = ids.filter(t => traceStatus(t) !== 'unreviewed').length;
    const cls = done === 0 ? '' : done === ids.length ? 'done' : 'partial';
    return `<div class="conv-row ${state.conv && state.conv.session_id === c.session_id ? 'active' : ''}" data-id="${esc(c.session_id)}">
      <span class="dot ${cls}"></span>${esc(c.scenario_id)} <span class="chip role">${esc(c.role)}</span>
      <div class="sub">${done}/${ids.length} traces reviewed · ${esc(c.tools.join(', ') || 'no tools')}</div></div>`;
  };
  if (!hasSample()) { $('list').innerHTML = rows.map(row).join(''); return; }
  const groups = [...Object.keys(state.manifest.batches), null];
  $('list').innerHTML = groups.map(key => {
    const members = rows.filter(c => convBatch(c) === key);
    if (!members.length) return '';
    return `<div class="batch-head">${esc(key ? batchLabel(key) : 'Outside the sample')}</div>` + members.map(row).join('');
  }).join('');
}
function renderCount() {
  const ids = sampleTraces();
  const done = ids.filter(t => traceStatus(t) !== 'unreviewed').length;
  $('count').textContent = `${done} / ${ids.length} ${hasSample() ? 'sampled ' : ''}traces reviewed`;
}

/* ---------- progress view ---------- */
function renderProgress() {
  const m = state.manifest;
  const rows = Object.entries(m.batches).map(([key, b]) => {
    const items = m.items.filter(i => i.batch === key);
    const reviewed = items.filter(i => traceStatus(i.trace_id) !== 'unreviewed');
    const notes = items.filter(i => traceStatus(i.trace_id) === 'notes').length;
    return `<tr><td>${esc(b.label)}</td><td>${b.target}</td><td>${items.length}</td><td>${reviewed.length}</td><td>${notes}</td><td>${reviewed.length - notes}</td></tr>`;
  }).join('');
  const all = m.items;

/* ---------- highlights ---------- */
function fieldEl(traceId, field) {
  return document.querySelector(`.turn[data-trace="${CSS.escape(traceId)}"] [data-field="${CSS.escape(field)}"]`);
}
function wrapOffsets(el, start, end, cls, id) {
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const targets = []; let pos = 0, node;
  while ((node = walker.nextNode())) {
    const len = node.nodeValue.length, s = Math.max(start, pos), e = Math.min(end, pos + len);
    if (s < e) targets.push([node, s - pos, e - pos]);
    pos += len;
  }
  for (const [n0, s, e] of targets) {
    let n = n0;
    if (s > 0) n = n.splitText(s);
    if (e - s < n.nodeValue.length) n.splitText(e - s);
    const mark = document.createElement('mark');
    mark.className = cls; if (id) mark.dataset.ann = id;
    n.parentNode.insertBefore(mark, n); mark.appendChild(n);
  }
}
function applyHighlights() {
  for (const t of state.conv.turns) {
    for (const a of annsFor(t.trace_id)) {
      if (a.kind !== 'note' || a.field === 'turn') continue;
      const el = fieldEl(a.trace_id, a.field);
      if (!el) continue;
      let { start, end } = a;
      if (el.textContent.slice(start, end) !== a.quote) {
        const at = el.textContent.indexOf(a.quote);
        if (at < 0) continue;
        start = at; end = at + a.quote.length;
      }
      const d = el.closest('details'); if (d) d.open = true;
      wrapOffsets(el, start, end, 'hl', a.id);
    }
  }
}
function layoutMargin() {

        ? document.querySelector(`.turn[data-trace="${CSS.escape(a.trace_id)}"] .turn-head`)
        : document.querySelector(`mark.hl[data-ann="${CSS.escape(a.id)}"]`);

    }
  }
  items.sort((x, y) => x.top - y.top);
  const narrow = window.innerWidth <= 900;
  let floor = 0;
  for (const { a, top } of items) {
    const div = document.createElement('div');
    div.className = 'mnote'; div.dataset.ann = a.id;
    div.innerHTML = `${a.field === 'turn' ? '<div class="q">(whole turn)</div>' : `<div class="q">“${esc(clip(a.quote, 80))}”</div>`}
      <div>${esc(a.note)}</div>${(a.history || []).some(h => 'note' in h) ? '<div class="edited">edited · original kept</div>' : ''}
      ${a.origin === 'agent_suggestion' ? '<div class="origin">agent draft, accepted by you</div>' : ''}

    if (narrow) {

    } else {
      div.style.top = Math.max(top, floor) + 'px';
      margin.appendChild(div);
      floor = Math.max(top, floor) + div.offsetHeight + 8;
    }
    div.querySelector('[data-act=edit]').onclick = () => editNote(a.id);
    div.querySelector('[data-act=delete]').onclick = () => deleteNote(a.id);
    div.onmouseenter = () => hover(a.id, true); div.onmouseleave = () => hover(a.id, false);
  }
  margin.style.minHeight = narrow ? '0' : floor + 'px';
}

function step(delta) {
  const ids = visibleIds();
  const at = state.conv ? ids.indexOf(state.conv.session_id) : -1;
  const next = ids[Math.min(ids.length - 1, Math.max(0, at + delta))];
  if (next && next !== (state.conv && state.conv.session_id)) openConv(next);
}
function nextUnreviewed() {
  const ids = visibleIds();
  const at = state.conv ? ids.indexOf(state.conv.session_id) : -1;
  const pending = id => {
    const c = state.list.find(x => x.session_id === id);
    const traces = hasSample() ? c.trace_ids.filter(sampleItem) : c.trace_ids;
    return traces.some(t => traceStatus(t) === 'unreviewed');
  };
  const order = [...ids.slice(at + 1), ...ids.slice(0, at + 1)];
  const next = order.find(pending);
  if (next) openConv(next); else toast('Every trace in this list has been reviewed');
}
function nextPendingSuggestion() {
  const pending = state.suggestions.filter(s => (s.status || 'pending') === 'pending');
  if (!pending.length) { toast('No pending suggestions'); return; }
  const at = pending.findIndex(s => state.conv && s.session_id === state.conv.session_id);
  const next = pending.find((s, i) => i > at && (!state.conv || s.session_id !== state.conv.session_id)) || pending[0];
  openConv(next.session_id);
}
function sampledTurn() {
  if (!state.conv) return null;
  const withSugg = state.conv.turns.find(t => pendingSugg(t.trace_id));
  if (withSugg) return withSugg;
  const turns = state.conv.turns.filter(t => !hasSample() || sampleItem(t.trace_id));
  return turns.find(t => traceStatus(t.trace_id) === 'unreviewed') || turns[0] || null;
}
async function markCleanAndNext() {
  const t = sampledTurn();
  if (!t) return;
  if (traceStatus(t.trace_id) === 'notes') { toast('This trace has notes; not marking it clean'); return; }
  if (traceStatus(t.trace_id) === 'unreviewed') await toggleNoFailure(t.trace_id);
  nextUnreviewed();
}
function noteOnSampledTurn() {
  const t = sampledTurn();
  if (!t) return;
  const head = document.querySelector(`.turn[data-trace="${CSS.escape(t.trace_id)}"] .turn-head`);
  head.scrollIntoView({ block: 'center' });
  openPopover({ trace_id: t.trace_id, field: 'turn', quote: '' }, head.getBoundingClientRect());
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'j') step(1);
  if (e.key === 'k') step(-1);
  if (e.key === 'f') markCleanAndNext();
  if (e.key === 'n') { e.preventDefault(); noteOnSampledTurn(); }
  if (e.key === 'a' || e.key === 'r') {
    const t = sampledTurn(), s = t && pendingSugg(t.trace_id);
    if (!s) { toast('No pending agent draft on the sampled turn'); return; }
    (e.key === 'a' ? acceptSuggestion(s.id, false) : rejectSuggestion(s.id))
      .then(done => done && (s.source === 'search' ? nextPendingSuggestion() : nextUnreviewed()));
  }
  if (e.key === 's') nextPendingSuggestion();
});
$('list').addEventListener('click', e => { const r = e.target.closest('.conv-row'); if (r) openConv(r.dataset.id); });
$('filter').addEventListener('input', renderList);
window.addEventListener('resize', () => state.conv && layoutMargin());

(async function boot() {
  [state.meta, state.list, state.annotations, state.manifest, state.suggestions] = await Promise.all([api.get('/api/meta'), api.get('/api/conversations'), api.get('/api/annotations'), api.get('/api/manifest'), api.get('/api/suggestions')]);
  $('src').textContent = 'Source: ' + state.meta.source;
  if (state.meta.source.startsWith('Export')) $('src').classList.add('fallback');
  renderList(); renderCount();
  const first = hasSample() ? state.list.find(convBatch) : state.list[0];
  if (first) openConv(first.session_id);
  setInterval(async () => {
    const meta = await api.get('/api/meta').catch(() => null);
    if (meta && meta.instance !== state.meta.instance) {
      if ($('popover').hidden) location.reload();
      return;
    }
    const next = await api.get('/api/manifest');
    if (next.items.length !== state.manifest.items.length) {
      state.manifest = next; renderList(); renderCount();
      if (state.conv) renderConv();
      if (!$('progress').hidden) renderProgress();
      toast('Sample updated');
    }
    const suggs = await api.get('/api/suggestions');
    if (JSON.stringify(suggs) !== JSON.stringify(state.suggestions) && $('popover').hidden) {
      state.suggestions = suggs;
      if (state.conv) renderConv();
    }
  }, 15000);
})();
</script>
